<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, 'Nimbus Roman No9 L', serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title -->
  <g transform="translate(60, 25)">
    <text x="0" y="20" font-size="16" font-weight="bold" fill="#0f172a">Ablation and Scalability Analysis</text>
    <text x="0" y="38" font-size="12" fill="#475569">Multi-branch ablation verification (Exp 4) and empirical gradient variance vs. circuit depth (Exp 5)</text>
  </g>

  <!-- ==================== LEFT PANEL: (a) ABLATION STUDY ==================== -->
  <g transform="translate(60, 75)">
    <rect width="490" height="500" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="25" y="30" font-size="14" font-weight="bold" fill="#0f172a">(a) Multi-Branch Ablation Study (MNIST)</text>
    <text x="25" y="48" font-size="11" fill="#475569">Parameter-controlled verification of quantum representational benefit</text>

    <!-- Bar Chart Grid (0% to 100%, y: 70 to 370 -> height 300, 3px per %) -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="60" y1="70" x2="450" y2="70" />
      <line x1="60" y1="130" x2="450" y2="130" />
      <line x1="60" y1="190" x2="450" y2="190" />
      <line x1="60" y1="250" x2="450" y2="250" />
      <line x1="60" y1="310" x2="450" y2="310" />
      <line x1="60" y1="370" x2="450" y2="370" />
    </g>

    <text x="50" y="74" font-size="11" text-anchor="end" fill="#64748b">100%</text>
    <text x="50" y="134" font-size="11" text-anchor="end" fill="#64748b">80%</text>
    <text x="50" y="194" font-size="11" text-anchor="end" fill="#64748b">60%</text>
    <text x="50" y="254" font-size="11" text-anchor="end" fill="#64748b">40%</text>
    <text x="50" y="314" font-size="11" text-anchor="end" fill="#64748b">20%</text>
    <text x="50" y="374" font-size="11" text-anchor="end" fill="#64748b">0%</text>

    <line x1="60" y1="370" x2="450" y2="370" stroke="#0f172a" stroke-width="1.2" />
    <line x1="60" y1="70" x2="60" y2="370" stroke="#0f172a" stroke-width="1.2" />

    <!-- 4 Bars: width 55, spacing -->
    <!-- Bar 1: Classical-Only (86.2% -> height 258.6, y = 370 - 258.6 = 111.4) -->
    <g transform="translate(85, 0)">
      <rect x="0" y="111" width="55" height="259" rx="2" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.2" />
      <text x="27" y="103" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">86.2%</text>
      <text x="27" y="390" font-size="11" text-anchor="middle" fill="#0f172a">Classical</text>
      <text x="27" y="405" font-size="10" text-anchor="middle" fill="#64748b">Only (136p)</text>
    </g>

    <!-- Bar 2: Quantum-Only (78.5% -> height 235.5, y = 370 - 235.5 = 134.5) -->
    <g transform="translate(175, 0)">
      <rect x="0" y="135" width="55" height="235" rx="2" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2" />
      <text x="27" y="127" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">78.5%</text>
      <text x="27" y="390" font-size="11" text-anchor="middle" fill="#0f172a">Quantum</text>
      <text x="27" y="405" font-size="10" text-anchor="middle" fill="#64748b">Only (16p)</text>
    </g>

    <!-- Bar 3: Classical-Extended (87.1% -> height 261.3, y = 370 - 261.3 = 108.7) -->
    <g transform="translate(265, 0)">
      <rect x="0" y="109" width="55" height="261" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.2" />
      <text x="27" y="101" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">87.1%</text>
      <text x="27" y="390" font-size="11" text-anchor="middle" fill="#0f172a">Extended</text>
      <text x="27" y="405" font-size="10" text-anchor="middle" fill="#64748b">12-Ch (120p)</text>
    </g>

    <!-- Bar 4: Proposed Hybrid (90.05% -> height 270.15, y = 370 - 270.15 = 99.85) -->
    <g transform="translate(355, 0)">
      <rect x="0" y="100" width="55" height="270" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.4" filter="url(#shadow)" />
      <text x="27" y="92" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">90.05%</text>
      <text x="27" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="#15803d">Proposed</text>
      <text x="27" y="405" font-size="10" text-anchor="middle" fill="#64748b">Parallel (152p)</text>
    </g>

    <!-- Finding Summary Box -->
    <g transform="translate(25, 430)">
      <rect width="440" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="20" font-size="11.5" font-weight="bold" fill="#0f172a">Key Finding:</text>
      <text x="15" y="38" font-size="11" fill="#334155">QC-CNN-Parallel outperforms equal-capacity classical CNNs (+2.95%),</text>
      <text x="15" y="52" font-size="11" fill="#334155">confirming genuine quantum-classical feature complementarity.</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: (b) SCALABILITY & BARREN PLATEAU ==================== -->
  <g transform="translate(600, 75)">
    <rect width="490" height="500" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="25" y="30" font-size="14" font-weight="bold" fill="#0f172a">(b) Scalability Sweep &amp; Barren Plateau Boundary</text>
    <text x="25" y="48" font-size="11" fill="#475569">Gradient Variance Var[∂ℒ/∂θ] vs. Variational Circuit Depth (Exp 5)</text>

    <!-- Semilog Plot Area: y: 70 to 370 (height 300, 10^0 down to 10^-5) -->
    <!-- 6 decades: 10^0 (70), 10^-1 (130), 10^-2 (190), 10^-3 (250), 10^-4 (310), 10^-5 (370) -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="75" y1="70" x2="450" y2="70" />
      <line x1="75" y1="130" x2="450" y2="130" />
      <line x1="75" y1="190" x2="450" y2="190" />
      <line x1="75" y1="250" x2="450" y2="250" />
      <line x1="75" y1="310" x2="450" y2="310" />
      <line x1="75" y1="370" x2="450" y2="370" />
    </g>

    <text x="65" y="74" font-size="11" text-anchor="end" fill="#64748b">10<tspan baseline-shift="super" font-size="8">0</tspan></text>
    <text x="65" y="134" font-size="11" text-anchor="end" fill="#64748b">10<tspan baseline-shift="super" font-size="8">-1</tspan></text>
    <text x="65" y="194" font-size="11" text-anchor="end" fill="#64748b">10<tspan baseline-shift="super" font-size="8">-2</tspan></text>
    <text x="65" y="254" font-size="11" text-anchor="end" fill="#64748b">10<tspan baseline-shift="super" font-size="8">-3</tspan></text>
    <text x="65" y="314" font-size="11" text-anchor="end" fill="#64748b">10<tspan baseline-shift="super" font-size="8">-4</tspan></text>
    <text x="65" y="374" font-size="11" text-anchor="end" fill="#64748b">10<tspan baseline-shift="super" font-size="8">-5</tspan></text>

    <line x1="75" y1="370" x2="450" y2="370" stroke="#0f172a" stroke-width="1.2" />
    <line x1="75" y1="70" x2="75" y2="370" stroke="#0f172a" stroke-width="1.2" />

    <!-- X ticks: Depth L=1 (110), L=2 (180), L=3 (260), L=4 (340), L=5 (420) -->
    <text x="110" y="390" font-size="11" text-anchor="middle" fill="#0f172a">L = 1</text>
    <text x="180" y="390" font-size="11" text-anchor="middle" font-weight="bold" fill="#15803d">L = 2*</text>
    <text x="260" y="390" font-size="11" text-anchor="middle" fill="#0f172a">L = 3</text>
    <text x="340" y="390" font-size="11" text-anchor="middle" fill="#b91c1c">L = 4</text>
    <text x="420" y="390" font-size="11" text-anchor="middle" fill="#b91c1c">L = 5</text>
    <text x="265" y="410" font-size="11" text-anchor="middle" fill="#475569">PQC Variational Depth L</text>

    <!-- Shaded Barren Plateau Danger Region (L >= 3.5) -->
    <rect x="300" y="70" width="150" height="300" fill="#fef2f2" opacity="0.6" />
    <text x="375" y="90" font-size="10.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Barren Plateau Zone</text>

    <!-- Curve for Variance vs Depth -->
    <!-- L=1: 0.052 (log10=-1.28 -> y=147) -->
    <!-- L=2: 0.019 (log10=-1.72 -> y=173) [Circuit 11 operating point] -->
    <!-- L=3: 0.0035 (log10=-2.46 -> y=218) -->
    <!-- L=4: 0.00031 (log10=-3.51 -> y=281) -->
    <!-- L=5: 0.000028 (log10=-4.55 -> y=343) -->
    <polyline points="110,147 180,173 260,218 340,281 420,343" fill="none" stroke="#b91c1c" stroke-width="2.5" />
    <circle cx="110" cy="147" r="4" fill="#15803d" />
    <circle cx="180" cy="173" r="5" fill="#15803d" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="260" cy="218" r="4" fill="#d97706" />
    <circle cx="340" cy="281" r="4" fill="#b91c1c" />
    <circle cx="420" cy="343" r="4" fill="#b91c1c" />

    <!-- Circuit 11 Marker Callout -->
    <g transform="translate(180, 140)">
      <line x1="0" y1="33" x2="35" y2="0" stroke="#15803d" stroke-width="1.2" />
      <rect x="35" y="-18" width="130" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1" />
      <text x="100" y="-3" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Circuit 11 (Disc=0.0191)</text>
    </g>

    <!-- Finding Summary Box -->
    <g transform="translate(25, 430)">
      <rect width="440" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="20" font-size="11.5" font-weight="bold" fill="#0f172a">Theoretical &amp; Empirical Validation:</text>
      <text x="15" y="38" font-size="11" fill="#334155">Beyond depth L ≥ 3, gradient variance vanishes exponentially.</text>
      <text x="15" y="52" font-size="11" fill="#334155">This empirically justifies the shallow 2-layer parallel design.</text>
    </g>
  </g>
</svg>
