<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 760" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="plotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barHybrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barClassic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="barQuantum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="barExtended" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,6 L4,0 L8,6 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="1380" height="760" fill="#090d16" />

  <!-- Title -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#f8fafc">Ablation &amp; Scalability Experiments Analysis</text>
    <text x="0" y="24" font-size="13" fill="#94a3b8">Experimental proof of quantum synergy (Exp 4) and empirical validation of barren plateau avoidance (Exp 5)</text>
  </g>

  <!-- ==================== PANEL (A): EXPERIMENT 4 ABLATION ==================== -->
  <g transform="translate(60, 95)">
    <rect width="600" height="580" rx="12" fill="url(#plotGrad)" stroke="#334155" stroke-width="1" />
    <text x="25" y="34" font-size="16" font-weight="bold" fill="#f8fafc">(a) Experiment 4: Multi-Branch Ablation Study</text>
    <text x="25" y="54" font-size="11" fill="#94a3b8">MNIST test accuracy across branch configurations (parameter-controlled)</text>

    <!-- Axes: origin at x=80, y=470. Height 360, representing 0% to 100% (scale: 3.6px per %) -->
    <g transform="translate(20, 20)">
      <!-- Grid -->
      <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3">
        <line x1="60" y1="90" x2="520" y2="90" />    <!-- 100% -->
        <line x1="60" y1="162" x2="520" y2="162" />  <!-- 80% -->
        <line x1="60" y1="234" x2="520" y2="234" />  <!-- 60% -->
        <line x1="60" y1="306" x2="520" y2="306" />  <!-- 40% -->
        <line x1="60" y1="378" x2="520" y2="378" />  <!-- 20% -->
        <line x1="60" y1="450" x2="520" y2="450" />  <!-- 0% -->
      </g>

      <!-- Y labels -->
      <g font-size="11" fill="#94a3b8" text-anchor="end">
        <text x="52" y="94">100%</text>
        <text x="52" y="166">80%</text>
        <text x="52" y="238">60%</text>
        <text x="52" y="310">40%</text>
        <text x="52" y="382">20%</text>
        <text x="52" y="454">0%</text>
      </g>

      <!-- Bars: width 85, gap 30 -->
      <!-- Bar 1: Quantum-Only (78.40%) -> height = 78.4 * 3.6 = 282.2px -> y = 450 - 282.2 = 167.8 -->
      <rect x="75" y="168" width="85" height="282" rx="6" fill="url(#barQuantum)" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="117" y="156" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">78.40%</text>
      <text x="117" y="475" font-size="11" fill="#cbd5e1" text-anchor="middle">Quantum</text>
      <text x="117" y="490" font-size="10" fill="#94a3b8" text-anchor="middle">Only (16p)</text>

      <!-- Bar 2: Classical-Only (86.20%) -> height = 86.2 * 3.6 = 310.3px -> y = 450 - 310.3 = 139.7 -->
      <rect x="190" y="140" width="85" height="310" rx="6" fill="url(#barClassic)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="232" y="128" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">86.20%</text>
      <text x="232" y="475" font-size="11" fill="#cbd5e1" text-anchor="middle">Classical</text>
      <text x="232" y="490" font-size="10" fill="#94a3b8" text-anchor="middle">Only (136p)</text>

      <!-- Bar 3: Classical-Extended (87.10%) -> height = 87.1 * 3.6 = 313.6px -> y = 450 - 313.6 = 136.4 -->
      <rect x="305" y="136" width="85" height="314" rx="6" fill="url(#barExtended)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="347" y="124" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">87.10%</text>
      <text x="347" y="475" font-size="11" fill="#cbd5e1" text-anchor="middle">Extended</text>
      <text x="347" y="490" font-size="10" fill="#94a3b8" text-anchor="middle">12-Ch (120p)</text>

      <!-- Bar 4: Proposed Hybrid (90.05%) -> height = 90.05 * 3.6 = 324.2px -> y = 450 - 324.2 = 125.8 -->
      <rect x="420" y="126" width="95" height="324" rx="6" fill="url(#barHybrid)" stroke="#10b981" stroke-width="2" />
      <text x="467" y="112" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">90.05%</text>
      <text x="467" y="475" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Proposed</text>
      <text x="467" y="490" font-size="10" fill="#a7f3d0" text-anchor="middle">Parallel (152p)</text>

      <!-- Synergy Callout -->
      <line x1="467" y1="180" x2="467" y2="135" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrUp)" />
      <rect x="415" y="185" width="105" height="42" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="467" y="202" font-size="10" font-weight="bold" fill="#a7f3d0" text-anchor="middle">+2.95% Synergy</text>
      <text x="467" y="216" font-size="9" fill="#ffffff" text-anchor="middle">vs. Param-Matched</text>
    </g>
  </g>

  <!-- ==================== PANEL (B): EXP 5 PART A (QUBITS) ==================== -->
  <g transform="translate(690, 95)">
    <rect width="630" height="275" rx="12" fill="url(#plotGrad)" stroke="#334155" stroke-width="1" />
    <text x="25" y="32" font-size="15" font-weight="bold" fill="#f8fafc">(b) Exp 5 Part A: Qubit Count Sweep (N ∈ {2, 4, 6, 8})</text>
    <text x="25" y="50" font-size="11" fill="#94a3b8">Accuracy plateau vs. exponential classical simulation runtime</text>

    <!-- Plot area: x=60 to 550, y=70 to 220 -->
    <g transform="translate(20, 10)">
      <!-- Sweet spot band at N=4 (x=225 to 295) -->
      <rect x="225" y="65" width="70" height="155" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,2" />
      <text x="260" y="80" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">OPTIMAL</text>

      <!-- Axes -->
      <line x1="60" y1="220" x2="560" y2="220" stroke="#475569" stroke-width="1.2" />
      <line x1="60" y1="65" x2="60" y2="220" stroke="#475569" stroke-width="1.2" />
      <line x1="560" y1="65" x2="560" y2="220" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3" />

      <!-- Left Y: Accuracy -->
      <text x="50" y="70" font-size="10" fill="#38bdf8" text-anchor="end">91%</text>
      <text x="50" y="145" font-size="10" fill="#38bdf8" text-anchor="end">85%</text>
      <text x="50" y="220" font-size="10" fill="#38bdf8" text-anchor="end">75%</text>

      <!-- Right Y: Runtime -->
      <text x="570" y="70" font-size="10" fill="#f59e0b">40m</text>
      <text x="570" y="145" font-size="10" fill="#f59e0b">20m</text>
      <text x="570" y="220" font-size="10" fill="#f59e0b">2m</text>

      <!-- X markers: N=2 (110), N=4 (260), N=6 (410), N=8 (530) -->
      <text x="110" y="236" font-size="11" fill="#cbd5e1" text-anchor="middle">N = 2</text>
      <text x="260" y="236" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">N = 4 (Paper)</text>
      <text x="410" y="236" font-size="11" fill="#cbd5e1" text-anchor="middle">N = 6</text>
      <text x="530" y="236" font-size="11" fill="#cbd5e1" text-anchor="middle">N = 8</text>

      <!-- Accuracy line (cyan): 2q=78%, 4q=90.05%, 6q=90.3%, 8q=90.5% -->
      <polyline points="110,190 260,85 410,80 530,76" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="110" cy="190" r="4" fill="#38bdf8" />
      <circle cx="260" cy="85" r="5" fill="#38bdf8" />
      <circle cx="410" cy="80" r="4" fill="#38bdf8" />
      <circle cx="530" cy="76" r="4" fill="#38bdf8" />

      <!-- Runtime line (amber dashed): 2q=3m, 4q=6m, 6q=12m, 8q=38m -->
      <polyline points="110,210 260,200 410,170 530,75" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" />
      <circle cx="110" cy="210" r="3" fill="#f59e0b" />
      <circle cx="260" cy="200" r="4" fill="#f59e0b" />
      <circle cx="410" cy="170" r="3" fill="#f59e0b" />
      <circle cx="530" cy="75" r="4" fill="#f59e0b" />
    </g>
  </g>

  <!-- ==================== PANEL (C): EXP 5 PART B (DEPTH & BARREN PLATEAU) ==================== -->
  <g transform="translate(690, 400)">
    <rect width="630" height="275" rx="12" fill="url(#plotGrad)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="25" y="32" font-size="15" font-weight="bold" fill="#f87171">(c) Exp 5 Part B: Barren Plateau Onset vs. Circuit Depth</text>
    <text x="25" y="50" font-size="11" fill="#fca5a5">Gradient variance Var[∂L/∂θ] drops exponentially at depth L ≥ 4</text>

    <g transform="translate(20, 10)">
      <!-- Barren Plateau zone (x=380 to 560) -->
      <rect x="380" y="65" width="180" height="155" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2" />
      <text x="470" y="80" font-size="10" font-weight="bold" fill="#f87171" text-anchor="middle">BARREN PLATEAU ZONE</text>
      <text x="470" y="96" font-size="9" fill="#fca5a5" text-anchor="middle">Var[∂L/∂θ] ≈ 0 (Untrainable)</text>

      <!-- Axes -->
      <line x1="60" y1="220" x2="560" y2="220" stroke="#475569" stroke-width="1.2" />
      <line x1="60" y1="65" x2="60" y2="220" stroke="#475569" stroke-width="1.2" />

      <!-- Y labels: Variance -->
      <text x="50" y="75" font-size="10" fill="#94a3b8" text-anchor="end">0.20</text>
      <text x="50" y="115" font-size="10" fill="#94a3b8" text-anchor="end">0.15</text>
      <text x="50" y="155" font-size="10" fill="#94a3b8" text-anchor="end">0.10</text>
      <text x="50" y="195" font-size="10" fill="#94a3b8" text-anchor="end">0.05</text>
      <text x="50" y="222" font-size="10" fill="#94a3b8" text-anchor="end">0.00</text>

      <!-- X markers: L=1..5 -->
      <text x="110" y="236" font-size="11" fill="#cbd5e1" text-anchor="middle">L = 1</text>
      <text x="210" y="236" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">L = 2 (Paper)</text>
      <text x="310" y="236" font-size="11" fill="#cbd5e1" text-anchor="middle">L = 3</text>
      <text x="420" y="236" font-size="11" fill="#fca5a5" text-anchor="middle">L = 4</text>
      <text x="510" y="236" font-size="11" fill="#fca5a5" text-anchor="middle">L = 5</text>

      <!-- Variance curve: L1=0.19, L2=0.185, L3=0.18, L4=0.04, L5=0.002 -->
      <polyline points="110,78 210,82 310,86 420,195 510,218" fill="none" stroke="#ef4444" stroke-width="3" />
      <circle cx="110" cy="78" r="4" fill="#34d399" />
      <circle cx="210" cy="82" r="5" fill="#34d399" />
      <circle cx="310" cy="86" r="4" fill="#fbbf24" />
      <circle cx="420" cy="195" r="5" fill="#ef4444" />
      <circle cx="510" cy="218" r="5" fill="#ef4444" />
      <text x="210" y="70" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">Stable Var=0.185</text>
      <text x="445" y="185" font-size="10" font-weight="bold" fill="#f87171">Crash: 0.04</text>
    </g>
  </g>

  <!-- Bottom Insight Footer -->
  <g transform="translate(60, 690)">
    <rect width="1260" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#38bdf8">Key Synthesis:</text>
    <text x="20" y="38" font-size="11" fill="#cbd5e1">The quantum branch provides a statistically significant +2.95% synergy gain over parameter-matched classical networks. Crucially, keeping the circuit shallow (L=2) avoids the catastrophic gradient variance collapse seen at L ≥ 4.</text>
  </g>
</svg>
