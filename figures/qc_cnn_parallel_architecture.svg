<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, 'Nimbus Roman No9 L', serif;">
  <defs>
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222222" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803d" />
    </marker>
    <!-- Drop Shadow for Subtle Depth -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ==================== 1. INPUT IMAGE WITH PATCH ==================== -->
  <g transform="translate(60, 160)">
    <!-- Base Image Container with Grayscale Pattern simulating Overhead/MNIST -->
    <rect x="0" y="0" width="110" height="110" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <!-- Stylized Grayscale Image Content -->
    <path d="M 5,20 Q 30,5 55,25 T 105,15 L 105,95 Q 75,105 45,90 T 5,95 Z" fill="#cbd5e1" opacity="0.6" />
    <path d="M 15,35 Q 40,25 70,50 T 95,85" stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M 25,75 Q 55,60 85,70" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="35" cy="40" r="10" fill="#475569" />
    <polygon points="65,25 80,45 55,45" fill="#334155" />
    <rect x="15" y="80" width="30" height="15" fill="#64748b" rx="2" />
    <rect x="70" y="70" width="25" height="25" fill="#334155" rx="2" />
    <!-- Highlighted Purple 2x2 Patch -->
    <rect x="42" y="42" width="26" height="26" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Image Border -->
    <rect x="0" y="0" width="110" height="110" fill="none" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- Diverging Branch Arrows -->
  <path d="M 175, 190 C 210, 175 230, 140 260, 125" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)" />
  <path d="M 175, 235 C 210, 255 240, 290 280, 310" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ==================== 2. QUANTUM FILTER BRANCH (TOP) ==================== -->
  <g transform="translate(265, 60)">
    <!-- 4 Input Wires -->
    <circle cx="0" cy="30" r="2.5" fill="#b45309" />
    <line x1="0" y1="30" x2="25" y2="30" stroke="#b45309" stroke-width="1.4" />
    <circle cx="0" cy="50" r="2.5" fill="#b45309" />
    <line x1="0" y1="50" x2="25" y2="50" stroke="#b45309" stroke-width="1.4" />
    <circle cx="0" cy="70" r="2.5" fill="#b45309" />
    <line x1="0" y1="70" x2="25" y2="70" stroke="#b45309" stroke-width="1.4" />
    <circle cx="0" cy="90" r="2.5" fill="#b45309" />
    <line x1="0" y1="90" x2="25" y2="90" stroke="#b45309" stroke-width="1.4" />

    <!-- Unitary Box U -->
    <rect x="25" y="15" width="120" height="90" rx="14" fill="#fff" stroke="#b45309" stroke-width="1.8" filter="url(#shadow)" />
    <text x="85" y="68" font-size="24" font-style="italic" fill="#b45309" text-anchor="middle" font-weight="bold">U</text>

    <!-- Connecting Wires from U to Measurement -->
    <line x1="145" y1="30" x2="160" y2="30" stroke="#b45309" stroke-width="1.4" />
    <line x1="145" y1="50" x2="160" y2="50" stroke="#b45309" stroke-width="1.4" />
    <line x1="145" y1="70" x2="160" y2="70" stroke="#b45309" stroke-width="1.4" />
    <line x1="145" y1="90" x2="160" y2="90" stroke="#b45309" stroke-width="1.4" />

    <!-- 4 Measurement Boxes [M] -->
    <g transform="translate(160, 20)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.4" />
      <text x="11" y="14" font-size="12" fill="#b45309" text-anchor="middle" font-family="'Times New Roman', serif">M</text>
    </g>
    <g transform="translate(160, 40)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.4" />
      <text x="11" y="14" font-size="12" fill="#b45309" text-anchor="middle" font-family="'Times New Roman', serif">M</text>
    </g>
    <g transform="translate(160, 60)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.4" />
      <text x="11" y="14" font-size="12" fill="#b45309" text-anchor="middle" font-family="'Times New Roman', serif">M</text>
    </g>
    <g transform="translate(160, 80)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.4" />
      <text x="11" y="14" font-size="12" fill="#b45309" text-anchor="middle" font-family="'Times New Roman', serif">M</text>
    </g>

    <!-- Branch Label -->
    <text x="85" y="130" font-size="15" fill="#1e293b" text-anchor="middle">Quantum filter</text>

    <!-- Arrow from M to Quantum Feature Maps -->
    <path d="M 185, 55 L 235, 80" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)" />
  </g>

  <!-- Quantum Feature Maps Stack (Orange 2.5D Stack) -->
  <g transform="translate(510, 115)">
    <!-- Layer 4 (back) -->
    <polygon points="0,0 55,0 55,65 0,65" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" transform="translate(0, 0)" />
    <!-- Layer 3 -->
    <polygon points="0,0 55,0 55,65 0,65" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" transform="translate(7, 8)" />
    <!-- Layer 2 -->
    <polygon points="0,0 55,0 55,65 0,65" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" transform="translate(14, 16)" />
    <!-- Layer 1 (front) -->
    <g transform="translate(21, 24)">
      <polygon points="0,0 55,0 55,65 0,65" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" filter="url(#shadow)" />
      <!-- Grid lines inside front map -->
      <line x1="18" y1="0" x2="18" y2="65" stroke="#fde68a" stroke-width="1" />
      <line x1="36" y1="0" x2="36" y2="65" stroke="#fde68a" stroke-width="1" />
      <line x1="0" y1="21" x2="55" y2="21" stroke="#fde68a" stroke-width="1" />
      <line x1="0" y1="43" x2="55" y2="43" stroke="#fde68a" stroke-width="1" />
      <!-- Highlighted cell -->
      <rect x="20" y="23" width="14" height="16" fill="#b45309" />
    </g>
  </g>

  <!-- ==================== 3. CLASSICAL FILTER BRANCH (BOTTOM) ==================== -->
  <g transform="translate(300, 260)">
    <!-- 4x4 Classical Kernel Filter Grid -->
    <rect x="0" y="0" width="80" height="80" fill="#fff" stroke="#15803d" stroke-width="1.6" filter="url(#shadow)" />
    <!-- Horizontal lines -->
    <line x1="0" y1="20" x2="80" y2="20" stroke="#15803d" stroke-width="1.2" />
    <line x1="0" y1="40" x2="80" y2="40" stroke="#15803d" stroke-width="1.2" />
    <line x1="0" y1="60" x2="80" y2="60" stroke="#15803d" stroke-width="1.2" />
    <!-- Vertical lines -->
    <line x1="20" y1="0" x2="20" y2="80" stroke="#15803d" stroke-width="1.2" />
    <line x1="40" y1="0" x2="40" y2="80" stroke="#15803d" stroke-width="1.2" />
    <line x1="60" y1="0" x2="60" y2="80" stroke="#15803d" stroke-width="1.2" />

    <!-- Label -->
    <text x="40" y="105" font-size="15" fill="#1e293b" text-anchor="middle">4 × 4</text>
    <text x="40" y="123" font-size="15" fill="#1e293b" text-anchor="middle">Classical filter</text>

    <!-- Arrow from Classical Filter to Classical Feature Maps -->
    <path d="M 85, 45 L 180, 50" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)" />
  </g>

  <!-- Classical Feature Maps Stack (Green 2.5D Stack, 8 Channels) -->
  <g transform="translate(540, 240)">
    <!-- Layer 4 (back) -->
    <polygon points="0,0 55,0 55,65 0,65" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3" transform="translate(0, 0)" />
    <!-- Layer 3 -->
    <polygon points="0,0 55,0 55,65 0,65" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3" transform="translate(6, 7)" />
    <!-- Layer 2 -->
    <polygon points="0,0 55,0 55,65 0,65" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3" transform="translate(12, 14)" />
    <!-- Layer 1 (front) -->
    <g transform="translate(18, 21)">
      <polygon points="0,0 55,0 55,65 0,65" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4" filter="url(#shadow)" />
      <!-- Grid lines inside front map -->
      <line x1="18" y1="0" x2="18" y2="65" stroke="#bbf7d0" stroke-width="1" />
      <line x1="36" y1="0" x2="36" y2="65" stroke="#bbf7d0" stroke-width="1" />
      <line x1="0" y1="21" x2="55" y2="21" stroke="#bbf7d0" stroke-width="1" />
      <line x1="0" y1="43" x2="55" y2="43" stroke="#bbf7d0" stroke-width="1" />
      <!-- Highlighted green cell -->
      <rect x="20" y="23" width="14" height="16" fill="#15803d" />
    </g>
  </g>

  <!-- ==================== 4. FUSION / FLATTEN ==================== -->
  <!-- Connecting line joining Quantum and Classical map stacks -->
  <path d="M 525, 175 C 500, 205 520, 245 545, 265" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Hollow 3D Arrow pointing to Flatten -->
  <g transform="translate(640, 210)">
    <polygon points="0,6 24,6 24,0 40,11 24,22 24,16 0,16" fill="#fff" stroke="#1e293b" stroke-width="1.3" />
    <text x="20" y="38" font-size="14" fill="#1e293b" text-anchor="middle">Flatten</text>
  </g>

  <!-- ==================== 5. FULLY CONNECTED LAYERS ==================== -->
  <!-- Flatten Feature Representation (Tall Slender Box) -->
  <g transform="translate(705, 95)">
    <rect x="0" y="0" width="18" height="240" fill="#fff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)" />
  </g>

  <!-- Arrow Flatten -> Fully1 -->
  <g transform="translate(735, 210)">
    <polygon points="0,6 20,6 20,0 34,11 20,22 20,16 0,16" fill="#fff" stroke="#1e293b" stroke-width="1.3" />
  </g>

  <!-- Fully 1 (Dense 128) -->
  <g transform="translate(780, 115)">
    <rect x="0" y="0" width="18" height="200" fill="#fff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)" />
    <text x="9" y="222" font-size="14" fill="#1e293b" text-anchor="middle">Fully1</text>
  </g>

  <!-- Arrow Fully1 -> Fully2 -->
  <g transform="translate(810, 210)">
    <polygon points="0,6 20,6 20,0 34,11 20,22 20,16 0,16" fill="#fff" stroke="#1e293b" stroke-width="1.3" />
  </g>

  <!-- Fully 2 (Dense 64) -->
  <g transform="translate(855, 135)">
    <rect x="0" y="0" width="18" height="160" fill="#fff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)" />
    <text x="9" y="182" font-size="14" fill="#1e293b" text-anchor="middle">Fully2</text>
  </g>

  <!-- Arrow Fully2 -> Output -->
  <g transform="translate(885, 210)">
    <polygon points="0,6 20,6 20,0 34,11 20,22 20,16 0,16" fill="#fff" stroke="#1e293b" stroke-width="1.3" />
  </g>

  <!-- Output (Dense 10) -->
  <g transform="translate(930, 150)">
    <rect x="0" y="0" width="18" height="130" fill="#fff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)" />
    <text x="9" y="152" font-size="14" fill="#1e293b" text-anchor="middle">Output</text>
  </g>

  <!-- ==================== 6. CLASSIFICATION LABELS ==================== -->
  <g transform="translate(965, 142)">
    <!-- 10 Horizontal Output Arrows & Labels -->
    <!-- 1. Car -->
    <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
    <text x="35" y="10" font-size="12.5" fill="#334155">Car</text>

    <!-- 2. Harbor -->
    <g transform="translate(0, 16)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Harbor</text>
    </g>

    <!-- 3. Helicopter -->
    <g transform="translate(0, 32)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Helicopter</text>
    </g>

    <!-- 4. Oil_gas_field -->
    <g transform="translate(0, 48)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Oil\_gas\_field</text>
    </g>

    <!-- 5. Parking_lot -->
    <g transform="translate(0, 64)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Parking\_lot</text>
    </g>

    <!-- 6. Plane -->
    <g transform="translate(0, 80)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Plane</text>
    </g>

    <!-- 7. Runway_mark -->
    <g transform="translate(0, 96)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Runway\_mark</text>
    </g>

    <!-- 8. Ship (Highlighted Target in Red) -->
    <g transform="translate(0, 112)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#b91c1c" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" font-weight="bold" fill="#b91c1c">Ship</text>
    </g>

    <!-- 9. Stadium -->
    <g transform="translate(0, 128)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Stadium</text>
    </g>

    <!-- 10. Storage_tank -->
    <g transform="translate(0, 144)">
      <polygon points="0,4 18,4 18,0 28,6 18,12 18,8 0,8" fill="#fff" stroke="#334155" stroke-width="1" />
      <text x="35" y="10" font-size="12.5" fill="#334155">Storage\_tank</text>
    </g>
  </g>
</svg>
