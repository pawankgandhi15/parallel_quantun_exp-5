<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 620" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="circBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="gateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1350" height="620" fill="url(#circBg)" />

  <!-- Title & Metadata -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#f8fafc">Circuit 11 — 4-Qubit Parameterized Quantum Circuit (PQC)</text>
    <text x="0" y="24" font-size="13" fill="#94a3b8">Selected via Expressibility (0.0071), Entanglement (0.5463), and Discreteness (0.0191) | 16 Trainable Parameters</text>
  </g>

  <!-- Stage Column Banners -->
  <g transform="translate(0, 85)">
    <!-- Stage 1 -->
    <rect x="140" y="0" width="150" height="26" rx="4" fill="#0284c7" fill-opacity="0.2" />
    <text x="215" y="18" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. ANGLE ENCODING</text>

    <!-- Stage 2 -->
    <rect x="310" y="0" width="110" height="26" rx="4" fill="#6366f1" fill-opacity="0.2" />
    <text x="365" y="18" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">2. ROTATION 1</text>

    <!-- Stage 3 -->
    <rect x="440" y="0" width="220" height="26" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="550" y="18" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">3. ENTANGLING 1 (CIRCLE)</text>

    <!-- Stage 4 -->
    <rect x="680" y="0" width="110" height="26" rx="4" fill="#6366f1" fill-opacity="0.2" />
    <text x="735" y="18" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">4. ROTATION 2</text>

    <!-- Stage 5 -->
    <rect x="810" y="0" width="240" height="26" rx="4" fill="#ec4899" fill-opacity="0.2" />
    <text x="930" y="18" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">5. ENTANGLING 2 (SHIFTED CIRCLE)</text>

    <!-- Stage 6 -->
    <rect x="1070" y="0" width="140" height="26" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="1140" y="18" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">6. MEASUREMENT</text>
  </g>

  <!-- Qubit Wire Horizontal Lines -->
  <!-- Wire 0: y=160, Wire 1: y=240, Wire 2: y=320, Wire 3: y=400 -->
  <g stroke="#334155" stroke-width="2">
    <line x1="110" y1="170" x2="1220" y2="170" />
    <line x1="110" y1="260" x2="1220" y2="260" />
    <line x1="110" y1="350" x2="1220" y2="350" />
    <line x1="110" y1="440" x2="1220" y2="440" />
  </g>

  <!-- Qubit Wire Labels -->
  <g font-size="15" font-weight="bold" fill="#e2e8f0">
    <text x="60" y="176">|q₀⟩</text>
    <text x="60" y="266">|q₁⟩</text>
    <text x="60" y="356">|q₂⟩</text>
    <text x="60" y="446">|q₃⟩</text>
  </g>

  <!-- ==================== STAGE 1: ENCODING (H + RY(x_i)) ==================== -->
  <!-- q0 -->
  <g transform="translate(150, 150)" filter="url(#gateShadow)">
    <rect width="36" height="40" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">H</text>
  </g>
  <g transform="translate(200, 146)" filter="url(#gateShadow)">
    <rect width="76" height="48" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="38" y="24" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(x₀)</text>
    <text x="38" y="39" font-size="9" fill="#99f6e4" text-anchor="middle">pixel 0</text>
  </g>

  <!-- q1 -->
  <g transform="translate(150, 240)" filter="url(#gateShadow)">
    <rect width="36" height="40" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">H</text>
  </g>
  <g transform="translate(200, 236)" filter="url(#gateShadow)">
    <rect width="76" height="48" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="38" y="24" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(x₁)</text>
    <text x="38" y="39" font-size="9" fill="#99f6e4" text-anchor="middle">pixel 1</text>
  </g>

  <!-- q2 -->
  <g transform="translate(150, 330)" filter="url(#gateShadow)">
    <rect width="36" height="40" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">H</text>
  </g>
  <g transform="translate(200, 326)" filter="url(#gateShadow)">
    <rect width="76" height="48" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="38" y="24" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(x₂)</text>
    <text x="38" y="39" font-size="9" fill="#99f6e4" text-anchor="middle">pixel 2</text>
  </g>

  <!-- q3 -->
  <g transform="translate(150, 420)" filter="url(#gateShadow)">
    <rect width="36" height="40" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">H</text>
  </g>
  <g transform="translate(200, 416)" filter="url(#gateShadow)">
    <rect width="76" height="48" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="38" y="24" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(x₃)</text>
    <text x="38" y="39" font-size="9" fill="#99f6e4" text-anchor="middle">pixel 3</text>
  </g>

  <!-- ==================== STAGE 2: ROTATION 1 (RY(θ0..θ3)) ==================== -->
  <g transform="translate(325, 146)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₀)</text>
  </g>
  <g transform="translate(325, 236)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₁)</text>
  </g>
  <g transform="translate(325, 326)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₂)</text>
  </g>
  <g transform="translate(325, 416)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₃)</text>
  </g>

  <!-- ==================== STAGE 3: ENTANGLING 1 (CIRCLE) ==================== -->
  <!-- CRX θ4: q0 -> q1 -->
  <circle cx="470" cy="170" r="5" fill="#c084fc" />
  <line x1="470" y1="170" x2="470" y2="240" stroke="#c084fc" stroke-width="2" />
  <g transform="translate(442, 240)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#f5d0fe" text-anchor="middle">RX(θ₄)</text>
  </g>

  <!-- CRX θ5: q1 -> q2 -->
  <circle cx="520" cy="260" r="5" fill="#c084fc" />
  <line x1="520" y1="260" x2="520" y2="330" stroke="#c084fc" stroke-width="2" />
  <g transform="translate(492, 330)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#f5d0fe" text-anchor="middle">RX(θ₅)</text>
  </g>

  <!-- CRX θ6: q2 -> q3 -->
  <circle cx="570" cy="350" r="5" fill="#c084fc" />
  <line x1="570" y1="350" x2="570" y2="420" stroke="#c084fc" stroke-width="2" />
  <g transform="translate(542, 420)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#f5d0fe" text-anchor="middle">RX(θ₆)</text>
  </g>

  <!-- CRX θ7: q3 -> q0 (wrap circle) -->
  <circle cx="620" cy="440" r="5" fill="#c084fc" />
  <line x1="620" y1="170" x2="620" y2="440" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,2" />
  <g transform="translate(592, 150)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#f5d0fe" text-anchor="middle">RX(θ₇)</text>
  </g>

  <!-- ==================== STAGE 4: ROTATION 2 (RY(θ8..θ11)) ==================== -->
  <g transform="translate(700, 146)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₈)</text>
  </g>
  <g transform="translate(700, 236)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₉)</text>
  </g>
  <g transform="translate(700, 326)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₁₀)</text>
  </g>
  <g transform="translate(700, 416)" filter="url(#gateShadow)">
    <rect width="70" height="48" rx="6" fill="#4338ca" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RY(θ₁₁)</text>
  </g>

  <!-- ==================== STAGE 5: ENTANGLING 2 (SHIFTED CIRCLE) ==================== -->
  <!-- Shifted starts q1 -> q2 -->
  <!-- CRX θ12: q1 -> q2 -->
  <circle cx="840" cy="260" r="5" fill="#f472b6" />
  <line x1="840" y1="260" x2="840" y2="330" stroke="#f472b6" stroke-width="2" />
  <g transform="translate(812, 330)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#fce7f3" text-anchor="middle">RX(θ₁₂)</text>
  </g>

  <!-- CRX θ13: q2 -> q3 -->
  <circle cx="890" cy="350" r="5" fill="#f472b6" />
  <line x1="890" y1="350" x2="890" y2="420" stroke="#f472b6" stroke-width="2" />
  <g transform="translate(862, 420)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#fce7f3" text-anchor="middle">RX(θ₁₃)</text>
  </g>

  <!-- CRX θ14: q3 -> q0 (wrap) -->
  <circle cx="940" cy="440" r="5" fill="#f472b6" />
  <line x1="940" y1="170" x2="940" y2="440" stroke="#f472b6" stroke-width="2" stroke-dasharray="4,2" />
  <g transform="translate(912, 150)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#fce7f3" text-anchor="middle">RX(θ₁₄)</text>
  </g>

  <!-- CRX θ15: q0 -> q1 (shifted finish) -->
  <circle cx="1000" cy="170" r="5" fill="#f472b6" />
  <line x1="1000" y1="170" x2="1000" y2="240" stroke="#f472b6" stroke-width="2" />
  <g transform="translate(972, 240)" filter="url(#gateShadow)">
    <rect width="56" height="40" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5" />
    <text x="28" y="24" font-size="10" font-weight="bold" fill="#fce7f3" text-anchor="middle">RX(θ₁₅)</text>
  </g>

  <!-- ==================== STAGE 6: MEASUREMENT (Pauli-Z) ==================== -->
  <g transform="translate(1090, 146)" filter="url(#gateShadow)">
    <rect width="85" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="42" y="24" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⟨Z₀⟩</text>
    <text x="42" y="39" font-size="9" fill="#a7f3d0" text-anchor="middle">[-1, 1]</text>
  </g>
  <g transform="translate(1090, 236)" filter="url(#gateShadow)">
    <rect width="85" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="42" y="24" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⟨Z₁⟩</text>
    <text x="42" y="39" font-size="9" fill="#a7f3d0" text-anchor="middle">[-1, 1]</text>
  </g>
  <g transform="translate(1090, 326)" filter="url(#gateShadow)">
    <rect width="85" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="42" y="24" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⟨Z₂⟩</text>
    <text x="42" y="39" font-size="9" fill="#a7f3d0" text-anchor="middle">[-1, 1]</text>
  </g>
  <g transform="translate(1090, 416)" filter="url(#gateShadow)">
    <rect width="85" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="42" y="24" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⟨Z₃⟩</text>
    <text x="42" y="39" font-size="9" fill="#a7f3d0" text-anchor="middle">[-1, 1]</text>
  </g>

  <!-- Output labels -->
  <text x="1200" y="175" font-size="12" fill="#34d399">Channel 0</text>
  <text x="1200" y="265" font-size="12" fill="#34d399">Channel 1</text>
  <text x="1200" y="355" font-size="12" fill="#34d399">Channel 2</text>
  <text x="1200" y="445" font-size="12" fill="#34d399">Channel 3</text>

  <!-- Footer Technical Note -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1230" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="24" font-size="12" font-weight="bold" fill="#f472b6">Key Insight (Eq. 24, Liu &amp; Lou 2026):</text>
    <text x="20" y="45" font-size="11" fill="#cbd5e1">The shift in Entangling Layer 2 (starting at q₁ instead of q₀) breaks structural symmetry with Layer 1, preventing overlapping entanglement patterns and maximizing expressive capacity without adding extra circuit depth.</text>
  </g>
</svg>
