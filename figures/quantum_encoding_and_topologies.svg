<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, 'Nimbus Roman No9 L', serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- ==================== PART 1: FIGURE 3 (ANGLE ENCODING) ==================== -->
  <g transform="translate(180, 20)">
    <!-- 2x2 Patch Matrix -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="120" height="120" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />
      <line x1="60" y1="0" x2="60" y2="120" stroke="#1e293b" stroke-width="1" />
      <line x1="0" y1="60" x2="120" y2="60" stroke="#1e293b" stroke-width="1" />

      <!-- Top-Left (alpha, 00) -->
      <rect x="0" y="0" width="60" height="60" fill="#ffffff" />
      <text x="15" y="25" font-size="16" font-style="italic">α</text>
      <text x="45" y="52" font-size="11" fill="#64748b">00</text>

      <!-- Top-Right (beta, 01) -->
      <rect x="60" y="0" width="60" height="60" fill="#f1f5f9" />
      <text x="75" y="25" font-size="16" font-style="italic">β</text>
      <text x="105" y="52" font-size="11" fill="#64748b">01</text>

      <!-- Bottom-Left (gamma, 10) -->
      <rect x="0" y="60" width="60" height="60" fill="#e2e8f0" />
      <text x="15" y="85" font-size="16" font-style="italic">γ</text>
      <text x="45" y="112" font-size="11" fill="#64748b">10</text>

      <!-- Bottom-Right (delta, 11) -->
      <rect x="60" y="60" width="60" height="60" fill="#cbd5e1" />
      <text x="75" y="85" font-size="16" font-style="italic">δ</text>
      <text x="105" y="112" font-size="11" fill="#64748b">11</text>
    </g>

    <!-- Arrow with Text -->
    <g transform="translate(145, 90)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="50" y="-18" font-size="13" text-anchor="middle" fill="#0f172a">Four-qubits</text>
      <text x="50" y="-4" font-size="13" text-anchor="middle" fill="#0f172a">angle encoding:</text>
    </g>

    <!-- 4 Wires with H and Ry gates -->
    <g transform="translate(280, 25)">
      <!-- Wire 0 -->
      <text x="0" y="24" font-size="14">|0⟩</text>
      <line x1="20" y1="20" x2="260" y2="20" stroke="#1e293b" stroke-width="1.2" />
      <rect x="45" y="5" width="28" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="59" y="25" font-size="13" text-anchor="middle">H</text>
      <rect x="95" y="5" width="45" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="117" y="25" font-size="13" text-anchor="middle">R<tspan baseline-shift="sub" font-size="9">y</tspan>(α)</text>

      <!-- Wire 1 -->
      <text x="0" y="59" font-size="14">|0⟩</text>
      <line x1="20" y1="55" x2="260" y2="55" stroke="#1e293b" stroke-width="1.2" />
      <rect x="45" y="40" width="28" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="59" y="60" font-size="13" text-anchor="middle">H</text>
      <rect x="95" y="40" width="45" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="117" y="60" font-size="13" text-anchor="middle">R<tspan baseline-shift="sub" font-size="9">y</tspan>(β)</text>

      <!-- Wire 2 -->
      <text x="0" y="94" font-size="14">|0⟩</text>
      <line x1="20" y1="90" x2="260" y2="90" stroke="#1e293b" stroke-width="1.2" />
      <rect x="45" y="75" width="28" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="59" y="95" font-size="13" text-anchor="middle">H</text>
      <rect x="95" y="75" width="45" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="117" y="95" font-size="13" text-anchor="middle">R<tspan baseline-shift="sub" font-size="9">y</tspan>(γ)</text>

      <!-- Wire 3 -->
      <text x="0" y="129" font-size="14">|0⟩</text>
      <line x1="20" y1="125" x2="260" y2="125" stroke="#1e293b" stroke-width="1.2" />
      <rect x="45" y="110" width="28" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="59" y="130" font-size="13" text-anchor="middle">H</text>
      <rect x="95" y="110" width="45" height="30" rx="3" fill="#fff" stroke="#1e293b" stroke-width="1.2" />
      <text x="117" y="130" font-size="13" text-anchor="middle">R<tspan baseline-shift="sub" font-size="9">y</tspan>(δ)</text>

      <!-- Ansatz Block -->
      <rect x="175" y="5" width="65" height="135" rx="14" fill="#fff" stroke="#1e293b" stroke-width="1.3" filter="url(#shadow)" />
      <text x="207" y="77" font-size="15" text-anchor="middle">Ansatz</text>
    </g>

    <!-- Subfigure Caption -->
    <text x="240" y="180" font-size="14" font-weight="bold" text-anchor="middle">(A) Quantum Angle Encoding</text>
  </g>

  <!-- Divider -->
  <line x1="50" y1="210" x2="1100" y2="210" stroke="#e2e8f0" stroke-width="1" />

  <!-- ==================== PART 2: FIGURE 4 (ENTANGLING TOPOLOGIES) ==================== -->
  <!-- (a) Linear Topology -->
  <g transform="translate(60, 230)">
    <text x="15" y="30" font-size="13">|0⟩</text>
    <text x="15" y="60" font-size="13">|0⟩</text>
    <text x="15" y="90" font-size="13">|0⟩</text>
    <text x="15" y="120" font-size="13">|0⟩</text>

    <!-- Encoding Block -->
    <rect x="40" y="12" width="45" height="116" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1" />
    <text x="62" y="65" font-size="10" text-anchor="middle">Encoding</text>
    <text x="62" y="78" font-size="10" text-anchor="middle" font-style="italic">U<tspan baseline-shift="sub" font-size="8">e</tspan>(x)</text>

    <!-- Barrier -->
    <line x1="93" y1="10" x2="93" y2="130" stroke="#000" stroke-width="1" />
    <line x1="96" y1="10" x2="96" y2="130" stroke="#000" stroke-width="1" />

    <!-- Dashed Ansatz Container -->
    <rect x="105" y="6" width="180" height="128" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Wires -->
    <line x1="96" y1="26" x2="295" y2="26" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="56" x2="295" y2="56" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="86" x2="295" y2="86" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="116" x2="295" y2="116" stroke="#1e293b" stroke-width="1.2" />

    <!-- Expression Layer (Tan) -->
    <rect x="115" y="16" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="46" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="76" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="106" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />

    <!-- Entangled Layer (Blue Linear: 0->1, 1->2, 2->3) -->
    <line x1="170" y1="26" x2="170" y2="56" stroke="#1e293b" stroke-width="1" />
    <circle cx="170" cy="26" r="2.5" fill="#1e293b" />
    <rect x="160" y="46" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="205" y1="56" x2="205" y2="86" stroke="#1e293b" stroke-width="1" />
    <circle cx="205" cy="56" r="2.5" fill="#1e293b" />
    <rect x="195" y="76" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="240" y1="86" x2="240" y2="116" stroke="#1e293b" stroke-width="1" />
    <circle cx="240" cy="86" r="2.5" fill="#1e293b" />
    <rect x="230" y="106" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <!-- Labels -->
    <text x="130" y="150" font-size="11" text-anchor="middle">Expression</text>
    <text x="210" y="150" font-size="11" text-anchor="middle">Entangled</text>
    <line x1="105" y1="156" x2="285" y2="156" stroke="#1e293b" stroke-width="1" />
    <text x="195" y="172" font-size="12" text-anchor="middle">Ansatz <tspan font-style="italic">U</tspan>(x)</text>
    <text x="155" y="200" font-size="14" font-weight="bold" text-anchor="middle">(a) Linear Topology</text>
  </g>

  <!-- (b) Circle Topology -->
  <g transform="translate(420, 230)">
    <text x="15" y="30" font-size="13">|0⟩</text>
    <text x="15" y="60" font-size="13">|0⟩</text>
    <text x="15" y="90" font-size="13">|0⟩</text>
    <text x="15" y="120" font-size="13">|0⟩</text>

    <!-- Encoding Block -->
    <rect x="40" y="12" width="45" height="116" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1" />
    <text x="62" y="65" font-size="10" text-anchor="middle">Encoding</text>
    <text x="62" y="78" font-size="10" text-anchor="middle" font-style="italic">U<tspan baseline-shift="sub" font-size="8">e</tspan>(x)</text>

    <!-- Barrier -->
    <line x1="93" y1="10" x2="93" y2="130" stroke="#000" stroke-width="1" />
    <line x1="96" y1="10" x2="96" y2="130" stroke="#000" stroke-width="1" />

    <!-- Dashed Ansatz Container -->
    <rect x="105" y="6" width="200" height="128" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Wires -->
    <line x1="96" y1="26" x2="315" y2="26" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="56" x2="315" y2="56" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="86" x2="315" y2="86" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="116" x2="315" y2="116" stroke="#1e293b" stroke-width="1.2" />

    <!-- Expression Layer (Tan) -->
    <rect x="115" y="16" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="46" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="76" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="106" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />

    <!-- Entangled Layer (Circle: 0->1, 1->2, 2->3, 3->0) -->
    <line x1="165" y1="26" x2="165" y2="56" stroke="#1e293b" stroke-width="1" />
    <circle cx="165" cy="26" r="2.5" fill="#1e293b" />
    <rect x="155" y="46" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="195" y1="56" x2="195" y2="86" stroke="#1e293b" stroke-width="1" />
    <circle cx="195" cy="56" r="2.5" fill="#1e293b" />
    <rect x="185" y="76" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="225" y1="86" x2="225" y2="116" stroke="#1e293b" stroke-width="1" />
    <circle cx="225" cy="86" r="2.5" fill="#1e293b" />
    <rect x="215" y="106" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <!-- Feedback loop 3->0 -->
    <line x1="255" y1="26" x2="255" y2="116" stroke="#1e293b" stroke-width="1" />
    <circle cx="255" cy="116" r="2.5" fill="#1e293b" />
    <rect x="245" y="16" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <!-- Labels -->
    <text x="130" y="150" font-size="11" text-anchor="middle">Expression</text>
    <text x="220" y="150" font-size="11" text-anchor="middle">Entangled</text>
    <line x1="105" y1="156" x2="305" y2="156" stroke="#1e293b" stroke-width="1" />
    <text x="205" y="172" font-size="12" text-anchor="middle">Ansatz <tspan font-style="italic">U</tspan>(x)</text>
    <text x="165" y="200" font-size="14" font-weight="bold" text-anchor="middle">(b) Circle Topology</text>
  </g>

  <!-- (c) All-to-All Topology -->
  <g transform="translate(790, 230)">
    <text x="15" y="30" font-size="13">|0⟩</text>
    <text x="15" y="60" font-size="13">|0⟩</text>
    <text x="15" y="90" font-size="13">|0⟩</text>
    <text x="15" y="120" font-size="13">|0⟩</text>

    <!-- Encoding Block -->
    <rect x="40" y="12" width="45" height="116" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1" />
    <text x="62" y="65" font-size="10" text-anchor="middle">Encoding</text>
    <text x="62" y="78" font-size="10" text-anchor="middle" font-style="italic">U<tspan baseline-shift="sub" font-size="8">e</tspan>(x)</text>

    <!-- Barrier -->
    <line x1="93" y1="10" x2="93" y2="130" stroke="#000" stroke-width="1" />
    <line x1="96" y1="10" x2="96" y2="130" stroke="#000" stroke-width="1" />

    <!-- Dashed Ansatz Container -->
    <rect x="105" y="6" width="220" height="128" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Wires -->
    <line x1="96" y1="26" x2="335" y2="26" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="56" x2="335" y2="56" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="86" x2="335" y2="86" stroke="#1e293b" stroke-width="1.2" />
    <line x1="96" y1="116" x2="335" y2="116" stroke="#1e293b" stroke-width="1.2" />

    <!-- Expression Layer (Tan) -->
    <rect x="115" y="16" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="46" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="76" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />
    <rect x="115" y="106" width="30" height="20" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1" />

    <!-- Entangled Layer (All-to-All: pairwise 0-1, 0-2, 0-3, 1-2, 1-3, 2-3) -->
    <line x1="160" y1="26" x2="160" y2="56" stroke="#1e293b" stroke-width="1" />
    <rect x="150" y="46" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="185" y1="26" x2="185" y2="86" stroke="#1e293b" stroke-width="1" />
    <rect x="175" y="76" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="210" y1="26" x2="210" y2="116" stroke="#1e293b" stroke-width="1" />
    <rect x="200" y="106" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="240" y1="56" x2="240" y2="86" stroke="#1e293b" stroke-width="1" />
    <rect x="230" y="76" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="265" y1="56" x2="265" y2="116" stroke="#1e293b" stroke-width="1" />
    <rect x="255" y="106" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <line x1="290" y1="86" x2="290" y2="116" stroke="#1e293b" stroke-width="1" />
    <rect x="280" y="106" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1" />

    <!-- Labels -->
    <text x="130" y="150" font-size="11" text-anchor="middle">Expression</text>
    <text x="230" y="150" font-size="11" text-anchor="middle">Entangled</text>
    <line x1="105" y1="156" x2="325" y2="156" stroke="#1e293b" stroke-width="1" />
    <text x="215" y="172" font-size="12" text-anchor="middle">Ansatz <tspan font-style="italic">U</tspan>(x)</text>
    <text x="175" y="200" font-size="14" font-weight="bold" text-anchor="middle">(c) All-to-All Topology</text>
  </g>
</svg>
