<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, 'Nimbus Roman No9 L', serif;">
  <defs>
    <!-- Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Legend -->
  <g transform="translate(60, 25)">
    <text x="0" y="20" font-size="16" font-weight="bold" fill="#0f172a">Quantum Noise Robustness Evaluation (MNIST Benchmark)</text>
    <text x="0" y="38" font-size="12" fill="#475569">Comparison across physical noise channels at error probabilities p ∈ {0.0, 0.1, 0.2, 0.3}</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(710, 25)">
    <rect width="380" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="15" y1="17" x2="40" y2="17" stroke="#15803d" stroke-width="2.5" />
    <circle cx="27" cy="17" r="4" fill="#15803d" />
    <text x="48" y="21" font-size="11.5" font-weight="bold" fill="#15803d">Proposed QC-CNN-Parallel</text>

    <line x1="205" y1="17" x2="230" y2="17" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2" />
    <polygon points="217,13 222,21 212,21" fill="#d97706" />
    <text x="236" y="21" font-size="11.5" fill="#92400e">HQNN-Quanv</text>

    <line x1="315" y1="17" x2="340" y2="17" stroke="#b91c1c" stroke-width="2" stroke-dasharray="2,2" />
    <rect x="325" y="14" width="6" height="6" fill="#b91c1c" />
    <text x="346" y="21" font-size="11.5" fill="#991b1b">QNN / CNN</text>
  </g>

  <!-- ==================== SUBPLOT 1: (a) DATA NOISE ==================== -->
  <g transform="translate(60, 80)">
    <rect width="490" height="260" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="20" y="25" font-size="13" font-weight="bold" fill="#0f172a">(a) Data Noise Channel</text>

    <!-- Plot Area: x: 60 to 450 (width 390), y: 40 to 220 (height 180 -> acc 0.60 to 1.00) -->
    <!-- Gridlines & Y-Axis Ticks -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="60" y1="40" x2="450" y2="40" />
      <line x1="60" y1="85" x2="450" y2="85" />
      <line x1="60" y1="130" x2="450" y2="130" />
      <line x1="60" y1="175" x2="450" y2="175" />
      <line x1="60" y1="220" x2="450" y2="220" />
    </g>

    <text x="50" y="44" font-size="11" text-anchor="end" fill="#64748b">1.00</text>
    <text x="50" y="89" font-size="11" text-anchor="end" fill="#64748b">0.90</text>
    <text x="50" y="134" font-size="11" text-anchor="end" fill="#64748b">0.80</text>
    <text x="50" y="179" font-size="11" text-anchor="end" fill="#64748b">0.70</text>
    <text x="50" y="224" font-size="11" text-anchor="end" fill="#64748b">0.60</text>

    <!-- X-Axis Labels: p=0.0 (80), p=0.1 (180), p=0.2 (280), p=0.3 (380) -->
    <line x1="60" y1="220" x2="450" y2="220" stroke="#0f172a" stroke-width="1.2" />
    <line x1="60" y1="40" x2="60" y2="220" stroke="#0f172a" stroke-width="1.2" />

    <text x="80" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.0</text>
    <text x="180" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.1</text>
    <text x="280" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.2</text>
    <text x="380" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.3</text>

    <!-- Proposed Curve (0.9005 -> 0.8915 -> 0.8900 -> 0.8425) -->
    <!-- y = 220 - (acc - 0.60)*450 -->
    <!-- p=0: 84.8, p=0.1: 88.8, p=0.2: 89.5, p=0.3: 110.9 -->
    <polyline points="80,85 180,89 280,89 380,111" fill="none" stroke="#15803d" stroke-width="2.5" />
    <circle cx="80" cy="85" r="3.5" fill="#15803d" />
    <circle cx="180" cy="89" r="3.5" fill="#15803d" />
    <circle cx="280" cy="89" r="3.5" fill="#15803d" />
    <circle cx="380" cy="111" r="3.5" fill="#15803d" />
    <text x="380" y="103" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">84.25%</text>

    <!-- HQNN-Quanv Curve (0.8320 -> 0.8344 -> 0.7796 -> 0.7125) -->
    <!-- p=0: 115.6, p=0.1: 114.5, p=0.2: 139.2, p=0.3: 169.4 -->
    <polyline points="80,116 180,115 280,139 380,169" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2" />
    <polygon points="80,112 84,118 76,118" fill="#d97706" />
    <polygon points="180,111 184,117 176,117" fill="#d97706" />
    <polygon points="280,135 284,141 276,141" fill="#d97706" />
    <polygon points="380,165 384,171 376,171" fill="#d97706" />
    <text x="380" y="184" font-size="10" fill="#d97706" text-anchor="middle">71.25%</text>

    <!-- CNN Curve (0.8935 -> 0.8840 -> 0.8530 -> 0.7844) -->
    <!-- p=0: 87.9, p=0.1: 92.2, p=0.2: 106.1, p=0.3: 137.0 -->
    <polyline points="80,88 180,92 280,106 380,137" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="2,2" />
    <rect x="77" y="85" width="6" height="6" fill="#b91c1c" />
    <rect x="177" y="89" width="6" height="6" fill="#b91c1c" />
    <rect x="277" y="103" width="6" height="6" fill="#b91c1c" />
    <rect x="377" y="134" width="6" height="6" fill="#b91c1c" />
    <text x="380" y="152" font-size="10" fill="#b91c1c" text-anchor="middle">78.44%</text>
  </g>

  <!-- ==================== SUBPLOT 2: (b) BIT-FLIP NOISE ==================== -->
  <g transform="translate(600, 80)">
    <rect width="490" height="260" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="20" y="25" font-size="13" font-weight="bold" fill="#0f172a">(b) Bit-Flip Noise Channel (Pauli-X)</text>

    <!-- Gridlines & Y-Axis Ticks -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="60" y1="40" x2="450" y2="40" />
      <line x1="60" y1="85" x2="450" y2="85" />
      <line x1="60" y1="130" x2="450" y2="130" />
      <line x1="60" y1="175" x2="450" y2="175" />
      <line x1="60" y1="220" x2="450" y2="220" />
    </g>

    <text x="50" y="44" font-size="11" text-anchor="end" fill="#64748b">1.00</text>
    <text x="50" y="89" font-size="11" text-anchor="end" fill="#64748b">0.90</text>
    <text x="50" y="134" font-size="11" text-anchor="end" fill="#64748b">0.80</text>
    <text x="50" y="179" font-size="11" text-anchor="end" fill="#64748b">0.70</text>
    <text x="50" y="224" font-size="11" text-anchor="end" fill="#64748b">0.60</text>

    <line x1="60" y1="220" x2="450" y2="220" stroke="#0f172a" stroke-width="1.2" />
    <line x1="60" y1="40" x2="60" y2="220" stroke="#0f172a" stroke-width="1.2" />

    <text x="80" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.0</text>
    <text x="180" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.1</text>
    <text x="280" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.2</text>
    <text x="380" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.3</text>

    <!-- Proposed Curve (0.9005 -> 0.8769 -> 0.8558 -> 0.8405) -->
    <!-- y: 85, 95, 105, 112 -->
    <polyline points="80,85 180,95 280,105 380,112" fill="none" stroke="#15803d" stroke-width="2.5" />
    <circle cx="80" cy="85" r="3.5" fill="#15803d" />
    <circle cx="180" cy="95" r="3.5" fill="#15803d" />
    <circle cx="280" cy="105" r="3.5" fill="#15803d" />
    <circle cx="380" cy="112" r="3.5" fill="#15803d" />
    <text x="380" y="104" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">84.05%</text>

    <!-- HQNN-Quanv Curve (0.8320 -> 0.6775 -> 0.6523 -> 0.6399) -->
    <!-- y: 116, 185, 196, 202 -->
    <polyline points="80,116 180,185 280,196 380,202" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2" />
    <polygon points="80,112 84,118 76,118" fill="#d97706" />
    <polygon points="180,181 184,187 176,187" fill="#d97706" />
    <polygon points="280,192 284,198 276,198" fill="#d97706" />
    <polygon points="380,198 384,204 376,204" fill="#d97706" />
    <text x="380" y="195" font-size="10" fill="#d97706" text-anchor="middle">63.99%</text>

    <!-- QNN Curve (0.8350 -> 0.7115 -> 0.6124 -> 0.4615) -->
    <!-- y: 114, 170, 214, 280 (clipped to 230) -->
    <polyline points="80,114 180,170 280,214 380,235" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="2,2" />
    <rect x="77" y="111" width="6" height="6" fill="#b91c1c" />
    <rect x="177" y="167" width="6" height="6" fill="#b91c1c" />
    <rect x="277" y="211" width="6" height="6" fill="#b91c1c" />
    <rect x="377" y="232" width="6" height="6" fill="#b91c1c" />
    <text x="380" y="248" font-size="10" fill="#b91c1c" text-anchor="middle">46.15% (Catastrophic)</text>
  </g>

  <!-- ==================== SUBPLOT 3: (c) PHASE-FLIP NOISE ==================== -->
  <g transform="translate(60, 370)">
    <rect width="490" height="260" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="20" y="25" font-size="13" font-weight="bold" fill="#0f172a">(c) Phase-Flip Noise Channel (Pauli-Z)</text>

    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="60" y1="40" x2="450" y2="40" />
      <line x1="60" y1="85" x2="450" y2="85" />
      <line x1="60" y1="130" x2="450" y2="130" />
      <line x1="60" y1="175" x2="450" y2="175" />
      <line x1="60" y1="220" x2="450" y2="220" />
    </g>

    <text x="50" y="44" font-size="11" text-anchor="end" fill="#64748b">1.00</text>
    <text x="50" y="89" font-size="11" text-anchor="end" fill="#64748b">0.90</text>
    <text x="50" y="134" font-size="11" text-anchor="end" fill="#64748b">0.80</text>
    <text x="50" y="179" font-size="11" text-anchor="end" fill="#64748b">0.70</text>
    <text x="50" y="224" font-size="11" text-anchor="end" fill="#64748b">0.60</text>

    <line x1="60" y1="220" x2="450" y2="220" stroke="#0f172a" stroke-width="1.2" />
    <line x1="60" y1="40" x2="60" y2="220" stroke="#0f172a" stroke-width="1.2" />

    <text x="80" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.0</text>
    <text x="180" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.1</text>
    <text x="280" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.2</text>
    <text x="380" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.3</text>

    <!-- Proposed Curve (0.9005 -> 0.8836 -> 0.8618 -> 0.8602) -->
    <!-- y: 85, 92, 102, 103 -->
    <polyline points="80,85 180,92 280,102 380,103" fill="none" stroke="#15803d" stroke-width="2.5" />
    <circle cx="80" cy="85" r="3.5" fill="#15803d" />
    <circle cx="180" cy="92" r="3.5" fill="#15803d" />
    <circle cx="280" cy="102" r="3.5" fill="#15803d" />
    <circle cx="380" cy="103" r="3.5" fill="#15803d" />
    <text x="380" y="95" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">86.02%</text>

    <!-- HQNN-Quanv Curve (0.8320 -> 0.8279 -> 0.8254 -> 0.8267) -->
    <!-- y: 116, 117, 118, 118 -->
    <polyline points="80,116 180,117 280,118 380,118" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2" />
    <polygon points="80,112 84,118 76,118" fill="#d97706" />
    <polygon points="180,113 184,119 176,119" fill="#d97706" />
    <polygon points="280,114 284,120 276,120" fill="#d97706" />
    <polygon points="380,114 384,120 376,120" fill="#d97706" />
    <text x="380" y="134" font-size="10" fill="#d97706" text-anchor="middle">82.67%</text>
  </g>

  <!-- ==================== SUBPLOT 4: (d) DEPOLARIZING NOISE ==================== -->
  <g transform="translate(600, 370)">
    <rect width="490" height="260" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="20" y="25" font-size="13" font-weight="bold" fill="#0f172a">(d) Depolarizing Noise Channel (Isotropic Decoherence)</text>

    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="60" y1="40" x2="450" y2="40" />
      <line x1="60" y1="85" x2="450" y2="85" />
      <line x1="60" y1="130" x2="450" y2="130" />
      <line x1="60" y1="175" x2="450" y2="175" />
      <line x1="60" y1="220" x2="450" y2="220" />
    </g>

    <text x="50" y="44" font-size="11" text-anchor="end" fill="#64748b">1.00</text>
    <text x="50" y="89" font-size="11" text-anchor="end" fill="#64748b">0.90</text>
    <text x="50" y="134" font-size="11" text-anchor="end" fill="#64748b">0.80</text>
    <text x="50" y="179" font-size="11" text-anchor="end" fill="#64748b">0.70</text>
    <text x="50" y="224" font-size="11" text-anchor="end" fill="#64748b">0.60</text>

    <line x1="60" y1="220" x2="450" y2="220" stroke="#0f172a" stroke-width="1.2" />
    <line x1="60" y1="40" x2="60" y2="220" stroke="#0f172a" stroke-width="1.2" />

    <text x="80" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.0</text>
    <text x="180" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.1</text>
    <text x="280" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.2</text>
    <text x="380" y="238" font-size="11" text-anchor="middle" fill="#0f172a">p = 0.3</text>

    <!-- Proposed Curve (0.9005 -> 0.8639 -> 0.8664 -> 0.8327) -->
    <!-- y: 85, 101, 100, 115 -->
    <polyline points="80,85 180,101 280,100 380,115" fill="none" stroke="#15803d" stroke-width="2.5" />
    <circle cx="80" cy="85" r="3.5" fill="#15803d" />
    <circle cx="180" cy="101" r="3.5" fill="#15803d" />
    <circle cx="280" cy="100" r="3.5" fill="#15803d" />
    <circle cx="380" cy="115" r="3.5" fill="#15803d" />
    <text x="380" y="106" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">83.27%</text>

    <!-- HQNN-Quanv Curve (0.8320 -> 0.7021 -> 0.6502 -> 0.6059) -->
    <!-- y: 116, 174, 197, 217 -->
    <polyline points="80,116 180,174 280,197 380,217" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,2" />
    <polygon points="80,112 84,118 76,118" fill="#d97706" />
    <polygon points="180,170 184,176 176,176" fill="#d97706" />
    <polygon points="280,193 284,199 276,199" fill="#d97706" />
    <polygon points="380,213 384,219 376,219" fill="#d97706" />
    <text x="380" y="210" font-size="10" fill="#d97706" text-anchor="middle">60.59%</text>

    <!-- QNN Curve (0.8350 -> 0.7552 -> 0.6944 -> 0.5904) -->
    <!-- y: 114, 150, 178, 224 -->
    <polyline points="80,114 180,150 280,178 380,224" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="2,2" />
