    <rect x="177" y="147" width="6" height="6" fill="#b91c1c" />
    <rect x="277" y="175" width="6" height="6" fill="#b91c1c" />
    <rect x="377" y="221" width="6" height="6" fill="#b91c1c" />
    <text x="380" y="238" font-size="10" fill="#b91c1c" text-anchor="middle">59.04%</text>
  </g>
</svg>
