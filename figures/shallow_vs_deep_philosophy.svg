<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, 'Nimbus Roman No9 L', serif;">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803d" />
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ==================== LEFT PANEL: DEEP SEQUENTIAL (PRIOR ART) ==================== -->
  <g transform="translate(50, 30)">
    <!-- Container Box -->
    <rect width="520" height="450" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Title -->
    <rect x="0" y="0" width="520" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text x="260" y="27" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">Deep Sequential Hybrid (Prior Art)</text>

    <!-- Flow Elements -->
    <g transform="translate(40, 65)">
      <!-- Input -->
      <rect x="0" y="0" width="160" height="32" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
      <text x="80" y="21" font-size="12" fill="#0f172a" text-anchor="middle">Input Image [28 × 28]</text>

      <line x1="80" y1="32" x2="80" y2="52" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)" />

      <!-- Layer 1 -->
      <rect x="0" y="54" width="160" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
      <text x="80" y="75" font-size="12" fill="#991b1b" text-anchor="middle">Quantum Layer 1 (PQC)</text>

      <line x1="80" y1="86" x2="80" y2="106" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)" />

      <!-- Layer 2 -->
      <rect x="0" y="108" width="160" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
      <text x="80" y="129" font-size="12" fill="#991b1b" text-anchor="middle">Quantum Layer 2 (PQC)</text>

      <line x1="80" y1="140" x2="80" y2="160" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)" />

      <!-- Layer 3 -->
      <rect x="0" y="162" width="160" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
      <text x="80" y="183" font-size="12" fill="#991b1b" text-anchor="middle">Quantum Layer 3 (PQC)</text>

      <line x1="80" y1="194" x2="80" y2="214" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)" />

      <!-- Layer 4 -->
      <rect x="0" y="216" width="160" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
      <text x="80" y="237" font-size="12" fill="#991b1b" text-anchor="middle">Quantum Layer 4 (PQC)</text>

      <line x1="80" y1="248" x2="80" y2="268" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrRed)" />

      <!-- Dense Head -->
      <rect x="0" y="270" width="160" height="32" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
      <text x="80" y="291" font-size="12" fill="#0f172a" text-anchor="middle">Dense Head (Logits)</text>
    </g>

    <!-- Side Analysis & Equations -->
    <g transform="translate(230, 75)">
      <rect x="0" y="0" width="260" height="330" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="26" font-size="13" font-weight="bold" fill="#b91c1c">Barren Plateau Trap:</text>
      
      <!-- Math Box -->
      <rect x="15" y="40" width="230" height="45" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
      <text x="130" y="68" font-size="13" font-style="italic" fill="#991b1b" text-anchor="middle">Var<tspan font-style="normal">[∂ℒ/∂θ]</tspan> ∈ 𝒪(1 / 2<tspan baseline-shift="super" font-size="10">n</tspan>)</text>

      <!-- Bullet points -->
      <text x="15" y="115" font-size="12" fill="#334155">• Deep variational circuit stacks</text>
      <text x="15" y="135" font-size="12" fill="#334155">  cause exponential gradient decay</text>
      <text x="15" y="155" font-size="12" fill="#334155">  (McClean et al., 2018).</text>
      
      <text x="15" y="185" font-size="12" fill="#334155">• Discreteness metric collapses:</text>
      <text x="25" y="205" font-size="12" font-style="italic" fill="#991b1b">Disc ≈ 10<tspan baseline-shift="super" font-size="9">-33</tspan> (Untrainable!)</text>

      <text x="15" y="235" font-size="12" fill="#334155">• Physical gate noise scales with</text>
      <text x="15" y="255" font-size="12" fill="#334155">  circuit depth (T<tspan baseline-shift="sub" font-size="9">1</tspan>, T<tspan baseline-shift="sub" font-size="9">2</tspan> decoherence).</text>

      <text x="15" y="285" font-size="12" fill="#334155">• Severe sequential latency bottleneck</text>
      <text x="15" y="305" font-size="12" fill="#334155">  on NISQ quantum co-processors.</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: SHALLOW PARALLEL (PROPOSED) ==================== -->
  <g transform="translate(630, 30)">
    <!-- Container Box -->
    <rect width="520" height="450" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Title -->
    <rect x="0" y="0" width="520" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" />
    <text x="260" y="27" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">QC-CNN-Parallel (Proposed Paradigm)</text>

    <!-- Flow Elements -->
    <g transform="translate(30, 65)">
      <!-- Input -->
      <rect x="40" y="0" width="180" height="32" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
      <text x="130" y="21" font-size="12" fill="#0f172a" text-anchor="middle">Input Image [B, 1, 28, 28]</text>

      <!-- Parallel Split Lines -->
      <path d="M 80, 32 L 35, 65" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrGreen)" />
      <path d="M 180, 32 L 225, 65" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrGreen)" />

      <!-- Classical Branch -->
      <rect x="0" y="67" width="120" height="70" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" />
      <text x="60" y="88" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Classical Conv2d</text>
      <text x="60" y="105" font-size="11" fill="#334155" text-anchor="middle">4×4 kernel, s=2</text>
      <text x="60" y="122" font-size="11" fill="#334155" text-anchor="middle">[B, 8, 14, 14]</text>

      <!-- Quantum Branch -->
      <rect x="140" y="67" width="120" height="70" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" />
      <text x="200" y="88" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Shallow PQC (Circ 11)</text>
      <text x="200" y="105" font-size="11" fill="#334155" text-anchor="middle">2×2 window, s=2</text>
      <text x="200" y="122" font-size="11" fill="#334155" text-anchor="middle">[B, 4, 14, 14]</text>

      <!-- Merge Lines -->
      <path d="M 60, 137 L 105, 175" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrGreen)" />
      <path d="M 200, 137 L 155, 175" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrGreen)" />

      <!-- Concatenation -->
      <rect x="40" y="177" width="180" height="35" rx="4" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4" />
      <text x="130" y="194" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Channel Concatenation</text>
      <text x="130" y="206" font-size="10" fill="#475569" text-anchor="middle">[B, 12, 14, 14]</text>

      <line x1="130" y1="212" x2="130" y2="238" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrGreen)" />

      <!-- Classification Head -->
      <rect x="40" y="240" width="180" height="55" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
      <text x="130" y="258" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">3-Layer Dense Head</text>
      <text x="130" y="273" font-size="10" fill="#475569" text-anchor="middle">2352 → 128 → 64 → C</text>
      <text x="130" y="287" font-size="10" fill="#475569" text-anchor="middle">Cross-Entropy Loss</text>
    </g>

    <!-- Side Analysis & Advantages -->
    <g transform="translate(300, 75)">
      <rect x="0" y="0" width="200" height="330" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="26" font-size="13" font-weight="bold" fill="#166534">Preserved Gradients:</text>
      
      <!-- Math Box -->
      <rect x="15" y="40" width="170" height="45" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text x="100" y="68" font-size="13" font-style="italic" fill="#166534" text-anchor="middle">Disc ≈ 0.0191 &gt;&gt; 0</text>

      <!-- Bullet points -->
      <text x="12" y="115" font-size="11.5" fill="#334155">• <tspan font-weight="bold">Width over Depth:</tspan></text>
      <text x="15" y="130" font-size="11" fill="#334155">  Parallelism adds expressive</text>
      <text x="15" y="145" font-size="11" fill="#334155">  channels without depth.</text>
      
      <text x="12" y="175" font-size="11.5" fill="#334155">• <tspan font-weight="bold">No Barren Plateaus:</tspan></text>
      <text x="15" y="190" font-size="11" fill="#334155">  Shallow 2-layer PQC keeps</text>
      <text x="15" y="205" font-size="11" fill="#334155">  healthy gradient flow.</text>

      <text x="12" y="235" font-size="11.5" fill="#334155">• <tspan font-weight="bold">NISQ Resilience:</tspan></text>
      <text x="15" y="250" font-size="11" fill="#334155">  Fewer physical gates reduce</text>
      <text x="15" y="265" font-size="11" fill="#334155">  environmental decoherence.</text>

      <text x="12" y="295" font-size="11.5" fill="#334155">• <tspan font-weight="bold">Feature Complementarity:</tspan></text>
      <text x="15" y="310" font-size="11" fill="#334155">  Classical textures + Quantum state.</text>
    </g>
  </g>
</svg>
