<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 720" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="deepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#1f1315" />
    </linearGradient>
    <linearGradient id="shallowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#091b18" />
    </linearGradient>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f87171" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="1350" height="720" fill="#090d16" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#f8fafc">Design Philosophy: Shallow Parallel Hybrid vs. Deep Sequential Hybrid</text>
    <text x="0" y="25" font-size="13" fill="#94a3b8">Why increasing width (parallel branches) avoids the Barren Plateau problem of deep quantum circuits (McClean et al., 2018)</text>
  </g>

  <!-- ==================== LEFT PANEL: DEEP SEQUENTIAL ==================== -->
  <g transform="translate(60, 95)">
    <rect width="590" height="490" rx="14" fill="url(#deepGrad)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Title -->
    <text x="30" y="38" font-size="16" font-weight="bold" fill="#f87171">DEEP SEQUENTIAL HYBRID (PRIOR ART)</text>
    <text x="30" y="58" font-size="12" fill="#fca5a5">VCNN, HQNN-Quanv, QC-ResNet (Depth 4)</text>

    <!-- Flow -->
    <g transform="translate(40, 85)">
      <!-- Input -->
      <rect x="0" y="0" width="160" height="34" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="80" y="22" font-size="12" fill="#cbd5e1" text-anchor="middle">Input Image [28×28]</text>

      <line x1="80" y1="34" x2="80" y2="52" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)" />

      <!-- Layer 1 -->
      <rect x="0" y="54" width="160" height="34" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1" />
      <text x="80" y="75" font-size="12" fill="#e4e4e7" text-anchor="middle">Quantum Layer 1</text>

      <line x1="80" y1="88" x2="80" y2="106" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)" />

      <!-- Layer 2 -->
      <rect x="0" y="108" width="160" height="34" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1" />
      <text x="80" y="129" font-size="12" fill="#e4e4e7" text-anchor="middle">Quantum Layer 2</text>

      <line x1="80" y1="142" x2="80" y2="160" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)" />

      <!-- Layer 3 -->
      <rect x="0" y="162" width="160" height="34" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1" />
      <text x="80" y="183" font-size="12" fill="#e4e4e7" text-anchor="middle">Quantum Layer 3</text>

      <line x1="80" y1="196" x2="80" y2="214" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)" />

      <!-- Layer 4 -->
      <rect x="0" y="216" width="160" height="34" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1" />
      <text x="80" y="237" font-size="12" fill="#e4e4e7" text-anchor="middle">Quantum Layer 4</text>

      <line x1="80" y1="250" x2="80" y2="268" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)" />

      <!-- Output -->
      <rect x="0" y="270" width="160" height="34" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="80" y="291" font-size="12" fill="#cbd5e1" text-anchor="middle">Dense Head</text>
    </g>

    <!-- Barren Plateau Curve plot box -->
    <g transform="translate(240, 85)">
      <rect width="310" height="180" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="15" y="24" font-size="12" font-weight="bold" fill="#f87171">BARREN PLATEAU PHENOMENON</text>
      
      <!-- Axes -->
      <line x1="40" y1="145" x2="285" y2="145" stroke="#64748b" stroke-width="1.5" />
      <line x1="40" y1="40" x2="40" y2="145" stroke="#64748b" stroke-width="1.5" />
      <text x="140" y="162" font-size="10" fill="#94a3b8">Circuit Depth (d)</text>
      <text x="15" y="45" font-size="10" fill="#94a3b8" transform="rotate(-90 25,75)">Var[∂L/∂θ]</text>

      <!-- Exponential decay curve -->
      <path d="M 45 50 Q 80 135 270 142" fill="none" stroke="#ef4444" stroke-width="3" />
      <circle cx="270" cy="142" r="4" fill="#ef4444" />
      
      <text x="120" y="80" font-size="11" font-weight="bold" fill="#fca5a5">Var ~ O(1/2ⁿ)</text>
      <text x="120" y="100" font-size="10" fill="#94a3b8">Gradients vanish exponentially</text>
      <text x="120" y="118" font-size="10" fill="#ef4444">Circuit becomes untrainable!</text>
    </g>

    <!-- Drawback Bullets -->
    <g transform="translate(30, 400)">
      <text x="0" y="0" font-size="12" fill="#fca5a5">❌ Exponential gradient vanishing with circuit depth</text>
      <text x="0" y="22" font-size="12" fill="#fca5a5">❌ High latency: 4× circuit evaluations per forward/backward pass</text>
      <text x="0" y="44" font-size="12" fill="#fca5a5">❌ High conv parameters (304 – 512) with inferior accuracy</text>
      <text x="0" y="66" font-size="12" fill="#fca5a5">❌ Fragile to NISQ quantum noise (drops to 46% - 63% acc)</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: SHALLOW PARALLEL ==================== -->
  <g transform="translate(700, 95)">
    <rect width="590" height="490" rx="14" fill="url(#shallowGrad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Title -->
    <text x="30" y="38" font-size="16" font-weight="bold" fill="#34d399">SHALLOW PARALLEL HYBRID (PROPOSED)</text>
    <text x="30" y="58" font-size="12" fill="#6ee7b7">QC-CNN-Parallel (Depth 3: 2 parallel branches + Dense Head)</text>

    <!-- Flow -->
    <g transform="translate(30, 85)">
      <!-- Input -->
      <rect x="40" y="0" width="180" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="130" y="22" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Input Image [28×28]</text>

      <!-- Fork branches -->
      <path d="M 90 34 L 90 55 L 40 55 L 40 70" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)" />
      <path d="M 170 34 L 170 55 L 220 55 L 220 70" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrGreen)" />

      <!-- Classical branch -->
      <rect x="0" y="72" width="110" height="70" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="55" y="94" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Classical Conv</text>
      <text x="55" y="110" font-size="10" fill="#a7f3d0" text-anchor="middle">4×4 Kernel</text>
      <text x="55" y="126" font-size="10" fill="#cbd5e1" text-anchor="middle">[B, 8, 14, 14]</text>

      <!-- Quantum branch -->
      <rect x="150" y="72" width="110" height="70" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1" />
      <text x="205" y="94" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Quantum PQC</text>
      <text x="205" y="110" font-size="10" fill="#e9d5ff" text-anchor="middle">2-Layer Circuit 11</text>
      <text x="205" y="126" font-size="10" fill="#cbd5e1" text-anchor="middle">[B, 4, 14, 14]</text>

      <!-- Join branches -->
      <path d="M 55 142 L 55 160 L 100 160 L 100 175" fill="none" stroke="#34d399" stroke-width="2" />
      <path d="M 205 142 L 205 160 L 160 160 L 160 175" fill="none" stroke="#a78bfa" stroke-width="2" />

      <!-- Concat -->
      <rect x="60" y="178" width="140" height="34" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text x="130" y="200" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Concat: [B, 12, 14, 14]</text>

      <line x1="130" y1="212" x2="130" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrGreen)" />

      <!-- Dense Head -->
      <rect x="40" y="238" width="180" height="34" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <text x="130" y="260" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Dense Head (3 Layers)</text>
    </g>

    <!-- Active Gradient Plot box -->
    <g transform="translate(320, 85)">
      <rect width="240" height="180" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="15" y="24" font-size="12" font-weight="bold" fill="#34d399">HEALTHY GRADIENTS</text>
      
      <!-- Axes -->
      <line x1="35" y1="145" x2="220" y2="145" stroke="#64748b" stroke-width="1.5" />
      <line x1="35" y1="40" x2="35" y2="145" stroke="#64748b" stroke-width="1.5" />
      <text x="90" y="162" font-size="10" fill="#94a3b8">Training Iterations</text>
      <text x="15" y="45" font-size="10" fill="#94a3b8" transform="rotate(-90 25,75)">Gradient Norm</text>

      <!-- Oscillating healthy gradient curve -->
      <path d="M 40 85 Q 55 60 70 90 T 100 80 T 130 95 T 160 82 T 190 88 T 215 85" fill="none" stroke="#10b981" stroke-width="2.5" />
      
      <text x="50" y="60" font-size="11" font-weight="bold" fill="#6ee7b7">Var[∂L/∂θ] &gt;&gt; 0</text>
      <text x="50" y="125" font-size="10" fill="#94a3b8">Shallow circuit maintains</text>
      <text x="50" y="138" font-size="10" fill="#34d399">robust backpropagation!</text>
    </g>

    <!-- Advantages Bullets -->
    <g transform="translate(30, 400)">
      <text x="0" y="0" font-size="12" fill="#6ee7b7">✅ Shallow 2-layer PQC avoids barren plateaus entirely</text>
      <text x="0" y="22" font-size="12" fill="#6ee7b7">✅ Multi-scale fusion: Classical captures spatial texture, Quantum models Hilbert space</text>
      <text x="0" y="44" font-size="12" fill="#6ee7b7">✅ Ultra-compact: Only 136 classical + 16 quantum = 152 conv parameters</text>
      <text x="0" y="66" font-size="12" fill="#6ee7b7">✅ Noise-resilient: 84.05% under p=0.3 Bit-flip noise (+20% over prior hybrids)</text>
    </g>
  </g>

  <!-- Bottom Comparison Summary -->
  <g transform="translate(60, 610)">
    <rect width="1230" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="28" font-size="13" font-weight="bold" fill="#38bdf8">Inspiration from Inception Networks (Szegedy et al.):</text>
    <text x="25" y="52" font-size="12" fill="#cbd5e1">Instead of making quantum circuits deeper (which causes exponentially vanishing gradients), QC-CNN-Parallel widens the architecture by running complementary classical and quantum convolutional filters simultaneously, achieving state-of-the-art results with minimal parameters.</text>
  </g>
</svg>
